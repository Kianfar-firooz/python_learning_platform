<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرکز دانلود | CheeseCode Academy</title>

    <link rel="stylesheet" href="./styles/terminal-python.css">
    <link rel="stylesheet" href="./styles/python-linux-style.css">
    <link rel="stylesheet" href="./styles/libraries-style.css">
    <link rel="stylesheet" href="./styles/themes.css">
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5b81b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CheeseCode">
    <link rel="stylesheet" href="styles/loading-style.css">
    <link rel="stylesheet" href="styles/notes-style.css">
    <link rel="stylesheet" href="styles/sticky-header.css">
    <link rel="stylesheet" href="styles/mobile-optimization.css">
    <script src="js/loading-utils.js"></script>
    <script src="js/back-to-top.js"></script>
    <script src="js/sticky-header.js"></script>
    <script src="./js/cheese-utils.js"></script>
    <script src="./configs/libraries-config.js"></script>
    <script src="./configs/libraries-functions.js"></script>
    <script src="./configs/quizzes-config.js"></script>
    <script src="./configs/python-quiz-config.js"></script>
    <script src="./configs/linux-quiz-config.js"></script>
    <script src="./configs/menu-config.js"></script>
    <script src="./configs/install-config.js"></script>
    <script src="./js/channel-modal.js"></script>
    <script src="./js/install-helper.js"></script>
</head>

<body data-theme="dark">

    <header class="hero-panel">
        <div class="brand">
            <img src="images/logo.jpeg" alt="Logo" class="brand-logo" id="logoBtn">
            <div class="brand-text">
                <h1>CheeseCode</h1>
                <p>مرکز دانلود | CheeseCode</p>
            </div>
        </div>
        <div style="display:flex; gap:0.5rem; align-items:center;">
            <a href="index.html" class="back-home-btn" title="بازگشت به صفحه اصلی">↩ خانه</a>
        </div>
    </header>

    <div class="libraries-wrapper">

        <div class="cache-status-box" id="cacheStatusBox">
            <div class="cache-status-icon">&#128230;</div>
            <div class="cache-status-info">
                <h3>وضعیت کش آفلاین</h3>
                <p id="cacheStatusText">در حال بررسی...</p>
                <div class="cache-progress-bar">
                    <div class="cache-progress-fill" id="globalProgressFill" style="width: 0%;"></div>
                </div>
            </div>
            <div id="actionButtonsContainer" style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
            </div>
        </div>

        <div id="sectionsContainer">
            <p style="color:#f5b81b; text-align:center; padding:1rem;">
                &#9203; در حال بارگذاری...
            </p>
        </div>

    </div>

    <script>
        (function () {
            'use strict';

            function start() {
                if (typeof window.CheeseUtils === 'undefined') {
                    document.getElementById('sectionsContainer').innerHTML =
                        '<p style="color:#ff6b6b; text-align:center; padding:1rem;">ERROR: cheese-utils.js لود نشده!</p>';
                    return;
                }
                if (typeof window.librariesConfig === 'undefined') {
                    document.getElementById('sectionsContainer').innerHTML =
                        '<p style="color:#ff6b6b; text-align:center; padding:1rem;">ERROR: libraries-config.js لود نشده!</p>';
                    return;
                }
                if (typeof window.loadAllData !== 'function') {
                    document.getElementById('sectionsContainer').innerHTML =
                        '<p style="color:#ff6b6b; text-align:center; padding:1rem;">ERROR: libraries-functions.js لود نشده!</p>';
                    return;
                }
                try {
                    window.loadAllData();
                } catch (err) {
                    document.getElementById('sectionsContainer').innerHTML =
                        '<p style="color:#ff6b6b; text-align:center; padding:1rem;">ERROR: ' + err.message + '</p>';
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', start);
            } else {
                start();
            }

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('./sw.js')
                        .then(function (r) { console.log('✅ SW ثبت شد'); })
                        .catch(function (err) { console.warn('⚠️ SW:', err); });
                });
            }
        })();
    </script>

</body>

</html>
