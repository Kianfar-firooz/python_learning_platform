<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمرین پایتون | آکادمی چیز کد</title>
    <link rel="icon" type="image/jpeg" href="images/logo.png">
    
    <!-- ========================================== -->
    <!-- 🧀 Pyodide از CDN (سریع و مطمئن)            -->
    <!-- ========================================== -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    
    <style>
        /* ==========================================
           🎨 استایل‌های اصلی
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #0a0e0a;
            color: #e0e8e0;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* تم روشن */
        body[data-theme="light"] {
            background: #f0f5f0;
            color: #1a2a1a;
        }

        body[data-theme="light"] .hero-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        body[data-theme="light"] .brand-text h1 {
            color: #1a3a1a;
        }

        body[data-theme="light"] .brand-text p {
            color: #4a6a4a;
        }

        body[data-theme="light"] #codeEditor {
            background: rgba(255, 255, 255, 0.7);
            color: #1a2a1a;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        body[data-theme="light"] #output {
            background: rgba(255, 255, 255, 0.5);
            color: #1a3a1a;
        }

        body[data-theme="light"] .status-bar {
            background: rgba(0, 0, 0, 0.03);
            color: #4a6a4a;
            border-color: rgba(0, 0, 0, 0.05);
        }

        body[data-theme="light"] .output-header {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.05);
        }

        body[data-theme="light"] .action-btn {
            background: rgba(0, 0, 0, 0.03);
            border-color: rgba(0, 0, 0, 0.08);
            color: #1a3a1a;
        }

        body[data-theme="light"] .action-btn:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        /* ==========================================
           هدر
           ========================================== */
        .hero-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
            background: rgba(10, 20, 10, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 255, 65, 0.04);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid rgba(0, 255, 65, 0.04);
        }

        .brand-text h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00ff41;
            letter-spacing: -0.5px;
            margin: 0;
            line-height: 1.2;
        }

        .brand-text p {
            font-size: 0.7rem;
            color: rgba(0, 255, 65, 0.2);
            margin: 0;
            letter-spacing: 1px;
        }

        /* ==========================================
           دکمه‌ها
           ========================================== */
        .action-btn {
            padding: 0.4rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 65, 0.06);
            background: rgba(0, 255, 65, 0.02);
            color: rgba(0, 255, 65, 0.3);
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(0, 255, 65, 0.04);
            border-color: rgba(0, 255, 65, 0.08);
        }

        .action-btn.run-btn {
            background: rgba(0, 255, 65, 0.06);
            border-color: rgba(0, 255, 65, 0.12);
            color: #00ff41;
        }

        .action-btn.run-btn:hover {
            background: rgba(0, 255, 65, 0.1);
        }

        .action-btn.danger-btn {
            color: #ff6b6b;
            border-color: rgba(255, 68, 68, 0.04);
        }

        .action-btn.danger-btn:hover {
            background: rgba(255, 68, 68, 0.04);
            border-color: rgba(255, 68, 68, 0.08);
        }

        .action-btn.warning-btn {
            color: #f5b81b;
            border-color: rgba(245, 184, 27, 0.04);
        }

        .action-btn.warning-btn:hover {
            background: rgba(245, 184, 27, 0.04);
            border-color: rgba(245, 184, 27, 0.08);
        }

        /* ==========================================
           محتوای اصلی
           ========================================== */
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .sidebar {
            max-width: 100%;
            width: 100%;
            padding: 1.5rem 0;
        }

        .sidebar-header {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(0, 255, 65, 0.08);
            border-bottom: 1px solid rgba(0, 255, 65, 0.02);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
        }

        /* ==========================================
           نوار وضعیت
           ========================================== */
        .status-bar {
            padding: 0.4rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            background: rgba(0, 255, 65, 0.01);
            border: 1px solid rgba(0, 255, 65, 0.02);
            color: rgba(0, 255, 65, 0.15);
            font-size: 0.75rem;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            min-height: 2.5rem;
            display: flex;
            align-items: center;
        }

        .status-bar.ready {
            color: rgba(0, 255, 65, 0.25);
            border-color: rgba(0, 255, 65, 0.04);
        }

        .status-bar.error {
            color: #ff6b6b;
            border-color: rgba(255, 68, 68, 0.05);
        }

        /* ==========================================
           ویرایشگر کد
           ========================================== */
        .editor-wrapper {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 65, 0.03);
            margin-bottom: 1rem;
        }

        #codeEditor {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 10, 0, 0.5);
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            border: none;
            outline: none;
            resize: vertical;
            line-height: 1.8;
            direction: ltr;
            text-align: left;
            min-height: 250px;
            tab-size: 4;
            transition: background 0.3s, color 0.3s;
        }

        /* ==========================================
           خروجی
           ========================================== */
        .output-wrapper {
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 65, 0.03);
            background: rgba(0, 0, 0, 0.2);
            overflow: hidden;
            min-height: 120px;
            transition: background 0.3s, border-color 0.3s;
        }

        .output-header {
            padding: 0.3rem 1rem;
            background: rgba(0, 255, 65, 0.01);
            border-bottom: 1px solid rgba(0, 255, 65, 0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output-header-label {
            color: rgba(0, 255, 65, 0.1);
            font-size: 0.65rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .output-clear-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            font-size: 0.7rem;
            transition: color 0.2s;
        }

        .output-clear-btn:hover {
            color: rgba(255, 255, 255, 0.1);
        }

        body[data-theme="light"] .output-clear-btn {
            color: rgba(0, 0, 0, 0.05);
        }

        body[data-theme="light"] .output-clear-btn:hover {
            color: rgba(0, 0, 0, 0.1);
        }

        #output {
            margin: 0;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: rgba(0, 255, 65, 0.4);
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 80px;
            max-height: 350px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
            transition: color 0.3s;
        }

        #output.error {
            color: #ff6b6b;
        }

        /* ==========================================
           اسکرول بار
           ========================================== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 65, 0.05);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 65, 0.1);
        }

        /* ==========================================
           ریسپانسیو
           ========================================== */
        @media (max-width: 640px) {
            .hero-panel {
                padding: 0.5rem 1rem;
            }

            .brand-text h1 {
                font-size: 1rem;
            }

            .brand-text p {
                font-size: 0.6rem;
            }

            .brand-logo {
                width: 35px;
                height: 35px;
            }

            .action-btn {
                font-size: 0.7rem;
                padding: 0.3rem 0.7rem;
            }

            #codeEditor {
                font-size: 0.8rem;
                min-height: 180px;
                padding: 0.7rem;
            }

            #output {
                font-size: 0.75rem;
                padding: 0.7rem;
            }

            .main-container {
                padding: 0 0.5rem;
            }

            .sidebar {
                padding: 0.5rem 0;
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================
         هدر
         ========================================== -->
    <header class="hero-panel">
        <div class="brand">
            <img src="images/logo.jpg" alt="Logo" class="brand-logo" id="logoBtn">
            <div class="brand-text">
                <h1>آکادمی چیز کد</h1>
                <p>CheeseCode Academy</p>
            </div>
        </div>
        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
            <button id="themeToggle" class="action-btn">☀️</button>
            <a href="index.html" class="action-btn" style="text-decoration:none;">🏠 بازگشت</a>
        </div>
    </header>

    <!-- ==========================================
         محتوای اصلی
         ========================================== -->
    <div class="main-container">
        <div class="sidebar">

            <!-- هدر ویرایشگر -->
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;">
                <h2 class="sidebar-header" style="margin-bottom:0; border-bottom:none; padding-bottom:0;">🐍 تمرین پایتون</h2>
                <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                    <button onclick="runCode()" class="action-btn run-btn">▶ اجرا</button>
                    <button onclick="clearCode()" class="action-btn danger-btn">🗑️</button>
                    <button onclick="resetCode()" class="action-btn warning-btn">🔄</button>
                </div>
            </div>

            <!-- نوار وضعیت -->
            <div class="status-bar" id="statusBar">
                ⏳ در حال بارگذاری پایتون...
            </div>

            <!-- ویرایشگر کد -->
            <div class="editor-wrapper">
                <textarea id="codeEditor" rows="14" spellcheck="false"># 🧀 کد پایتون خود را بنویسید

import numpy as np

arr = np.array([1, 2, 3, 4, 5])
print("آرایه:", arr)
print("مجموع:", arr.sum())
print("میانگین:", arr.mean())</textarea>
            </div>

            <!-- خروجی -->
            <div class="output-wrapper">
                <div class="output-header">
                    <span class="output-header-label">📤 خروجی</span>
                    <button onclick="clearOutput()" class="output-clear-btn">پاک کردن</button>
                </div>
                <pre id="output"></pre>
            </div>

        </div>
    </div>

    <!-- ==========================================
         جاوااسکریپت (نسخه اصلاح‌شده)
         ========================================== -->
    <script>
        // ============================================
        // ۱. متغیرها و ارجاعات DOM
        // ============================================
        let pyodide = null;
        let isReady = false;
        let isLoading = false;

        const statusBar = document.getElementById('statusBar');
        const outputEl = document.getElementById('output');
        const codeEditor = document.getElementById('codeEditor');

        // ============================================
        // ۲. مقداردهی Pyodide
        // ============================================
        async function initPyodide() {
            if (isLoading) return;
            isLoading = true;

            try {
                updateStatus('⏳ در حال بارگذاری پایتون...', 'loading');

                pyodide = await loadPyodide({
                    indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/'
                });

                updateStatus('⏳ در حال بارگذاری numpy...', 'loading');
                await pyodide.loadPackage('numpy');

                isReady = true;
                const version = pyodide.runPython('import sys; sys.version.split()[0]');
                updateStatus(`✅ محیط آماده است (Python ${version})`, 'ready');
                console.log('🧀 Pyodide با numpy آماده شد!');

            } catch (e) {
                console.error('❌ خطا:', e);
                updateStatus(`❌ خطا: ${e.message}`, 'error');
            } finally {
                isLoading = false;
            }
        }

        // ============================================
        // ۳. اجرای کد (نسخه اصلاح‌شده)
        // ============================================
        async function runCode() {
            if (!isReady || !pyodide) {
                outputEl.textContent = '⏳ منتظر آماده شدن پایتون...';
                outputEl.className = '';
                return;
            }

            const code = codeEditor.value;
            if (!code.trim()) {
                outputEl.textContent = '⚠️ کد بنویس!';
                outputEl.className = '';
                return;
            }

            outputEl.textContent = '⏳ در حال اجرا...';
            outputEl.className = '';

            try {
                // 🔥 روش صحیح برای گرفتن خروجی print
                // 1. Redirect کردن stdout به یک متغیر
                // 2. اجرای کد
                // 3. گرفتن مقدار stdout
                
                const result = await pyodide.runPythonAsync(`
import sys
from io import StringIO

# ذخیره stdout اصلی
_stdout = sys.stdout

# تغییر مسیر stdout به StringIO
sys.stdout = StringIO()

try:
    # اجرای کد کاربر
    ${code}
finally:
    # گرفتن خروجی
    output = sys.stdout.getvalue()
    # برگرداندن stdout به حالت اولیه
    sys.stdout = _stdout

output
                `);

                // نمایش خروجی
                if (result && result.trim()) {
                    outputEl.textContent = result;
                } else {
                    outputEl.textContent = '✅ اجرا شد (خروجی خالی)';
                }
                outputEl.className = '';

            } catch (e) {
                outputEl.textContent = `❌ ${e.message}`;
                outputEl.className = 'error';
            }
        }

        // ============================================
        // ۴. توابع کمکی
        // ============================================
        function updateStatus(message, type) {
            statusBar.textContent = message;
            statusBar.className = 'status-bar';
            if (type === 'ready') statusBar.classList.add('ready');
            if (type === 'error') statusBar.classList.add('error');
        }

        function clearCode() {
            codeEditor.value = '';
            clearOutput();
        }

        function clearOutput() {
            outputEl.textContent = '';
            outputEl.className = '';
        }

        function resetCode() {
            codeEditor.value = `# 🧀 کد نمونه
import numpy as np

arr = np.array([1, 2, 3, 4, 5])
print("آرایه:", arr)
print("مجموع:", arr.sum())
print("میانگین:", arr.mean())`;
            clearOutput();
        }

        // ============================================
        // ۵. مدیریت تم
        // ============================================
        function loadTheme() {
            const saved = localStorage.getItem('cheese_theme') || 'dark';
            document.body.setAttribute('data-theme', saved);
            const btn = document.getElementById('themeToggle');
            if (btn) btn.textContent = saved === 'dark' ? '☀️' : '🌙';
        }

        document.getElementById('themeToggle').addEventListener('click', function() {
            const body = document.body;
            const current = body.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', next);
            localStorage.setItem('cheese_theme', next);
            this.textContent = next === 'dark' ? '☀️' : '🌙';
        });

        // ============================================
        // ۶. مقداردهی اولیه
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadTheme();

            // میانبر صفحه کلید برای اجرا (Ctrl+Enter)
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    runCode();
                }
            });

            // شروع فرآیند بارگذاری
            setTimeout(initPyodide, 500);
            console.log('🧀 Playground (نسخه نهایی) آماده است!');
        });
    </script>

</body>
</html>
