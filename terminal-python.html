<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <title>ترمینال پایتون | CheeseCode</title>
    <link rel="stylesheet" href="./styles/terminal-python.css">
    <link rel="stylesheet" href="./styles/python-linux-style.css">
    <link rel="stylesheet" href="./styles/themes.css">
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5b81b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CheeseCode">
    <link rel="stylesheet" href="styles/loading-style.css">
    <link rel="stylesheet" href="styles/notes-style.css">
    <link rel="stylesheet" href="styles/sticky-header.css">
    <link rel="stylesheet" href="styles/mobile-optimization.css">
    <script src="js/loading-utils.js"></script>
    <script src="js/back-to-top.js"></script>
    <script src="js/sticky-header.js"></script>
    <script src="./pyodide/pyodide.js"></script>
    <script src="./js/python-engine.js"></script>
    <script src="./js/cheese-utils.js"></script>
    <script src="./configs/menu-config.js"></script>
    <script src="./configs/install-config.js"></script>
    <script src="./js/channel-modal.js"></script>
    <script src="./js/focus-mode.js"></script>
    <script src="./js/install-helper.js"></script>
</head>

<body data-theme="dark">
    <header class="hero-panel">
        <div class="brand">
            <img src="images/logo.jpeg" alt="Logo" class="brand-logo" id="logoBtn">
            <div class="brand-text">
                <h1>CheeseCode</h1>
                <p>ترمینال پایتون | CheeseCode</p>
            </div>
        </div>
        <div style="display:flex; gap:0.5rem; align-items:center;">
            <button id="focusToggle" title="حالت تمرکز" class="action-btn"
                style="background:transparent; border:1px solid rgba(245,184,27,0.1);">🧘</button>
            <a href="index.html" class="back-home-btn" title="بازگشت به صفحه اصلی">↩ خانه</a>
        </div>
    </header>

    <div class="terminal-wrapper" dir="ltr">
        <div class="terminal-topbar">
            <div class="window-dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <span class="terminal-label" dir="ltr">CheeseCode@terminal:~</span>
            <span id="pyodideStatus"
                style="margin-right: auto; margin-left: 1rem; font-size: 0.7rem; color: rgba(245, 184, 27, 0.5);">⏳ در
                حال آماده‌سازی...</span>
        </div>

        <div class="terminal-body">
            <label for="code-input" class="editor-label">
                محیط اجرای آزاد پایتون (Python 3.11)
                <span id="saveStatus" style="float: left; font-size: 0.7rem; color: rgba(0, 212, 255, 0.5);"></span>
            </label>

            <textarea id="code-input" class="code-textarea" placeholder="# کد پایتون خود را اینجا بنویسید...
"></textarea>

            <div class="action-bar">
                <button class="btn-terminal" id="runBtn" onclick="executeTerminal()" disabled>⏳ در حال
                    آماده‌سازی...</button>
                <button class="btn-terminal btn-secondary" onclick="downloadPythonFile()">💾 دانلود .py</button>
                <button class="btn-terminal btn-secondary" onclick="clearCode()">🗑️ پاک کردن</button>
                <span style="font-size: 11px; color: #8899aa; margin-right: auto;">میانبر: Ctrl + Enter</span>
            </div>

            <div class="output-container">
                <div class="output-title">خروجی ترمینال (STDOUT):</div>
                <pre id="output-box"
                    class="terminal-output">⏳ در حال آماده‌سازی مفسر پایتون... لطفاً چند لحظه صبر کنید.</pre>
            </div>
        </div>
    </div>

    <script>
        let isPyodideReady = false;
        var CODE_STORAGE_KEY = 'cheese_terminal_code';
        var saveTimeout = null;

        // ============================================
        // ذخیره‌ی خودکار کد
        // ============================================
        function loadSavedCode() {
            try {
                var saved = localStorage.getItem(CODE_STORAGE_KEY);
                if (saved) {
                    document.getElementById('code-input').value = saved;
                    showSaveStatus('📦 بازیابی شد');
                }
            } catch (e) { }
        }

        function saveCode() {
            try {
                var code = document.getElementById('code-input').value;
                localStorage.setItem(CODE_STORAGE_KEY, code);
                showSaveStatus('💾 ذخیره شد');
            } catch (e) { }
        }

        function showSaveStatus(msg) {
            var el = document.getElementById('saveStatus');
            if (el) {
                el.textContent = msg;
                setTimeout(function () {
                    el.textContent = '';
                }, 1500);
            }
        }

        function clearCode() {
            if (!confirm('آیا مطمئنی می‌خوای کد رو پاک کنی؟')) return;
            document.getElementById('code-input').value = '';
            localStorage.removeItem(CODE_STORAGE_KEY);
            showSaveStatus('🗑️ پاک شد');
        }

        // ============================================
        // آماده‌سازی پایتون
        // ============================================
        async function preparePython() {
            let statusEl = document.getElementById('pyodideStatus');
            let runBtn = document.getElementById('runBtn');
            let outputBox = document.getElementById('output-box');

            try {
                if (typeof initPythonEngine !== 'function') {
                    throw new Error('python-engine.js لود نشده');
                }

                statusEl.textContent = '⏳ در حال بارگذاری...';
                outputBox.innerText = '⏳ در حال بارگذاری مفسر پایتون...\n\nاین فقط بار اول طول می‌کشه.\nبارهای بعدی از کش مرورگر لود میشه.';

                await initPythonEngine();
                isPyodideReady = true;

                statusEl.textContent = '✅ آماده';
                statusEl.style.color = '#00d4ff';

                runBtn.disabled = false;
                runBtn.textContent = '▶ اجرای کد';

                outputBox.innerText = '✅ مفسر پایتون آماده است!\n\nکد پایتون خود را بنویسید و دکمه‌ی اجرا را بزنید.\n\nمیانبر: Ctrl + Enter';
            } catch (err) {
                statusEl.textContent = '❌ خطا';
                statusEl.style.color = '#ff6b6b';
                outputBox.innerText = '❌ خطا در بارگذاری مفسر پایتون\n\nلطفاً صفحه را رفرش کنید.';
            }
        }

        // ============================================
        // اجرای کد
        // ============================================
        async function executeTerminal() {
            let codeInput = document.getElementById('code-input');
            let outputBox = document.getElementById('output-box');

            if (!isPyodideReady) {
                outputBox.innerText = '⏳ لطفاً صبر کنید، مفسر پایتون هنوز آماده نیست...';
                return;
            }

            if (!codeInput.value.trim()) {
                outputBox.innerText = '❌ لطفاً کدی بنویسید!';
                return;
            }

            outputBox.innerText = "⏳ در حال اجرا...";

            try {
                let result = await runPythonCode(codeInput.value);
                outputBox.innerText = result || '(هیچ خروجی‌ای تولید نشد)';
            } catch (err) {
                outputBox.innerText = '❌ خطا در اجرا:\n' + err.message;
            }
        }

        // ============================================
        // دانلود فایل
        // ============================================
        function downloadPythonFile() {
            let code = document.getElementById('code-input').value;
            let blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'script.py';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ============================================
        // رویدادها
        // ============================================
        document.addEventListener('DOMContentLoaded', function () {
            loadSavedCode();

            var codeInput = document.getElementById('code-input');

            codeInput.addEventListener('input', function () {
                if (saveTimeout) clearTimeout(saveTimeout);
                saveTimeout = setTimeout(saveCode, 2000);
            });

            codeInput.addEventListener('keydown', function (e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    executeTerminal();
                }
            });

            // ذخیره قبل از بستن
            window.addEventListener('beforeunload', saveCode);

            setTimeout(preparePython, 500);
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js')
                    .then(function (r) { console.log('✅ SW ثبت شد'); })
                    .catch(function (err) { console.warn('⚠️ SW:', err); });
            });
        }
    </script>
</body>

</html>
