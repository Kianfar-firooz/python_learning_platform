<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آکادمی چیزکد | CheeseCode Academy</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="styles/index-style.css">
    <link rel="stylesheet" href="styles/themes.css">
    <link rel="icon" type="image/jpeg" href="images/logo.jpeg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5b81b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CheeseCode">
    <script src="js/loading-utils.js"></script>
    <script src="js/back-to-top.js"></script>
    <link rel="stylesheet" href="styles/mobile-optimization.css">
    <script src="js/sticky-header.js"></script>
    <script src="configs/index-config.js"></script>
    <script src="js/cheese-utils.js"></script>
    <script src="configs/install-config.js"></script>
    <script src="js/install-helper.js"></script>
</head>

<body>

    <header class="index-header">
        <div class="index-header-brand">
            <img src="images/logo.jpeg" alt="Logo" class="index-header-logo">
            <div>
                <h1 class="index-header-title">آکادمی چیزکد</h1>
                <p class="index-header-sub">CheeseCode Academy</p>
            </div>
        </div>
    </header>

    <div class="logo-wrapper">
        <img src="images/logo.jpeg" class="main-logo" alt="Logo">
    </div>

    <div class="glass-card">
        <h1>CheeseCode Academy</h1>
        <p class="tagline">آموزش ساده پایتون مثل خوردن پنیر 🍕</p>
        <p class="index-intro">دوره‌های رایگان پایتون و لینوکس، ترمینال آنلاین، کوییز و پروژه — همه داخل مرورگر</p>
        <div id="course-list"></div>
    </div>

    <div id="welcomeModal" class="modal">
        <div class="modal-content">
            <h2>🎓 خوش آمدید</h2>
            <p style="margin:1rem 0;">آموزش ساده پایتون مثل خوردن پنیر 🍕</p>
            <a href="https://ble.ir/cheesecode" class="btn-link">👉 ورود به کانال بله</a>
            <a href="https://ble.ir/cheese_code" class="btn-link"
                style="background:transparent; color:#f5b81b; border:1px solid #f5b81b;">ارتباط با ادمین</a>
            <button onclick="document.getElementById('welcomeModal').style.display='none'"
                style="margin-top:10px; background:none; border:none; color:#8899aa; cursor:pointer;">بستن</button>
        </div>
    </div>

    <script>
        (function () {
            var container = document.getElementById('course-list');
            if (typeof indexCoursesConfig !== 'undefined' && indexCoursesConfig.length > 0) {
                container.innerHTML = '';
                for (var i = 0; i < indexCoursesConfig.length; i++) {
                    var course = indexCoursesConfig[i];
                    var link = document.createElement('a');
                    link.className = 'course-card';
                    link.href = course.url;
                    var titleHtml = '<span class="course-card-title">' + course.title + '</span>';
                    var descHtml = course.desc ? '<span class="course-card-desc">' + course.desc + '</span>' : '';
                    link.innerHTML = titleHtml + descHtml;
                    container.appendChild(link);
                }
            }

            if (localStorage.getItem('cheese_welcome_shown')) {
                document.getElementById('welcomeModal').style.display = 'none';
            } else {
                document.getElementById('welcomeModal').style.display = 'flex';
                localStorage.setItem('cheese_welcome_shown', 'true');
            }

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('./sw.js')
                        .then(function (registration) {
                            console.log('✅ Service Worker ثبت شد:', registration.scope);
                        })
                        .catch(function (err) {
                            console.warn('⚠️ Service Worker ثبت نشد:', err);
                        });
                });
            }

            console.log('🧀 Index page ready!');
        })();
    </script>
</body>

</html>
